# Copy this file to secrets.yaml (gitignored) and fill in real values before applying.
# Generate a strong JWT secret with: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: medimap-db
  namespace: medimap
type: Opaque
stringData:
  POSTGRES_USER: medimap
  POSTGRES_PASSWORD: CHANGE_ME_STRONG_PASSWORD
  POSTGRES_DB: medimap
---
apiVersion: v1
kind: Secret
metadata:
  name: medimap-backend
  namespace: medimap
type: Opaque
stringData:
  # host is the headless Postgres service name (see postgres.yaml)
  DATABASE_URL: "postgres://medimap:CHANGE_ME_STRONG_PASSWORD@postgres:5432/medimap?sslmode=disable"
  # not actually used in read-only mode, but config.Load() still requires it to be non-empty
  JWT_SECRET: "CHANGE_ME_ANY_LONG_RANDOM_STRING"
