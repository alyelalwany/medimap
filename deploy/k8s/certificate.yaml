apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: alyelalwany@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: medimap-tls
  namespace: medimap
spec:
  secretName: medimap-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: medimap.elalwany.de
  dnsNames:
    - medimap.elalwany.de
