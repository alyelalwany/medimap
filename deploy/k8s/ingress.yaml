apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medimap
  namespace: medimap
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - medimap.elalwany.de
      secretName: medimap-tls
  rules:
    - host: medimap.elalwany.de
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8081
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
